name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'requirements*.lock'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv pip install --system -r requirements-dev.lock
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: python scripts/check_router_soc.py
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-dev.lock

  quality:
    name: Typecheck & Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'requirements*.lock'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv pip install --system -r requirements-dev.lock
      - run: pyright
      - run: pytest --tb=short -q

  security:
    name: CodeQL Security Scan
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  container-readonly-smoke-test:
    name: Read-only Rootfs Smoke Test
    timeout-minutes: 30
    needs: [lint, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    # Same osa-backend.container/osa-backend-worker.container restrictions
    # planned for production (see osa-deploy): a read-only rootfs can't be
    # exercised by the normal pytest suite (no test runs against an
    # actually read-only-mounted filesystem), so this is that verification
    # -- it must gate release-image, not just run alongside it.
    env:
      SMOKE_TEST_ENV: >-
        -e APP_ENVIRONMENT=test -e CORS_ORIGINS=http://localhost
        -e DATABASE_URL=postgresql://test:test@localhost:5432/test
        -e SECRET_KEY=ci-read-only-rootfs-smoke-test-dummy-secret-key-not-for-real-use
        -e VALKEY_HOST=127.0.0.1 -e VALKEY_PORT=6379
      RUN_RESTRICTIONS: >-
        --read-only --tmpfs /tmp:mode=1777
        --security-opt no-new-privileges --cap-drop=all --network host
      SMOKE_TEST_IMAGE: ghcr.io/kirchenmusik-st-augustin/osa-backend:${{ github.sha }}-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push prod image (test tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: ${{ env.SMOKE_TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull test image
        run: docker pull $SMOKE_TEST_IMAGE

      - name: Run web container under production restrictions
        run: |
          docker run -d --name osa-backend-web-smoke $RUN_RESTRICTIONS \
            $SMOKE_TEST_ENV $SMOKE_TEST_IMAGE

      - name: Poll web container health endpoint
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Web container never became healthy under a read-only rootfs"
          docker logs osa-backend-web-smoke
          exit 1

      - name: Check web container logs for read-only rootfs violations
        run: |
          docker logs osa-backend-web-smoke > web-smoke.log 2>&1
          docker stop osa-backend-web-smoke
          cat web-smoke.log
          if grep -qiE "read-only file system|EROFS|permission denied" web-smoke.log; then
            echo "::error::Web container hit a read-only rootfs violation"
            exit 1
          fi

      - name: Run worker container under production restrictions
        run: |
          docker run -d --name osa-backend-worker-smoke $RUN_RESTRICTIONS \
            $SMOKE_TEST_ENV -e SKIP_MIGRATIONS=true \
            $SMOKE_TEST_IMAGE arq app.worker.settings.WorkerSettings

      - name: Wait for worker startup log
        run: |
          for _ in $(seq 1 30); do
            docker logs osa-backend-worker-smoke 2>&1 | grep -qE "functions" && exit 0
            sleep 1
          done
          echo "::error::Worker container never logged a successful startup under a read-only rootfs"
          docker logs osa-backend-worker-smoke
          exit 1

      - name: Check worker container logs for read-only rootfs violations
        run: |
          docker logs osa-backend-worker-smoke > worker-smoke.log 2>&1
          docker stop osa-backend-worker-smoke
          cat worker-smoke.log
          if grep -qiE "read-only file system|EROFS|permission denied" worker-smoke.log; then
            echo "::error::Worker container hit a read-only rootfs violation"
            exit 1
          fi

  release-image:
    name: Build & Push Image
    timeout-minutes: 30
    needs: [container-readonly-smoke-test, security]
    runs-on: ubuntu-latest
    # Only ever promote what was built from main: workflow_dispatch can be
    # started on any branch, which would otherwise ship unreviewed code as
    # :latest to the auto-updating production host.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kirchenmusik-st-augustin/osa-backend
      DIGEST: ${{ needs.container-readonly-smoke-test.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image by digest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            "$IMAGE@$DIGEST"
