repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-router-soc
        name: Router Separation-of-Concerns Check
        entry: podman exec osa-backend python scripts/check_router_soc.py
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: Pyright Strict Type Checking
        entry: podman exec osa-backend python -m pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Pytest & Code Coverage
        entry: podman exec osa-backend pytest --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: coverage-gate
        name: Coverage minimums per metric
        entry: podman exec osa-backend python scripts/check_coverage_gate.py
        language: system
        pass_filenames: false
        always_run: true
