{% extends "layout.html" %}
{% block content %}
<p>Ein neues Benutzerkonto hat sich registriert:</p>
<table>
  <tr>
    <td><strong>Name:</strong></td>
    <td>{{ surname }}, {{ givenname }}</td>
  </tr>
  <tr>
    <td><strong>Email:</strong></td>
    <td>{{ email }}</td>
  </tr>
  <tr>
    <td><strong>Rufnummer:</strong></td>
    <td>{{ phone }}</td>
  </tr>
</table>
{% endblock %}
